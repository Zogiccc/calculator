<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科学计算器 - 前后端分离</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      background: radial-gradient(circle at 20% 0%, #1e293b 0%, #0b0f17 55%);
      color: #e6e8ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }

    /* ---------- 计算器主卡片 ---------- */
    .calculator {
      width: 100%;
      max-width: 420px; /* 稍微放宽，容纳科学按键 */
      padding: 20px;
      background: #131720;
      border: 1px solid #232a38;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    .calc-header h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
    .calc-header .hint { margin: 0 0 16px; font-size: 12px; color: #7b8496; }

    /* ---------- 显示区 ---------- */
    .display {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 6px;
      min-height: 110px;
      padding: 16px;
      background: #0b0f17;
      border: 1px solid #1e2533;
      border-radius: 14px;
      overflow: hidden;
    }

    .expression {
      min-height: 20px;
      font-size: 15px;
      line-height: 1.4;
      color: #8b93a7;
      text-align: right;
      word-break: break-all;
    }

    .result {
      min-height: 38px;
      font-size: 30px;
      font-weight: 600;
      line-height: 1.2;
      text-align: right;
      word-break: break-all;
      color: #e6e8ee;
      transition: color 0.15s ease;
    }

    .result.is-ok      { color: #4ade80; }
    .result.is-error   { font-size: 15px; font-weight: 500; color: #f87171; }
    .result.is-loading { font-size: 18px; font-weight: 500; color: #7b8496; }

    .status {
      min-height: 16px;
      margin: 6px 2px 12px;
      font-size: 11px;
      color: #6b7280;
      text-align: right;
    }

    /* ---------- 标准键盘区 ---------- */
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
    
    /* ---------- 科学计算键盘区 ---------- */
    .keys-scientific {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid #232a38;
      margin-bottom: 10px;
    }

    .key {
      padding: 14px 0;
      border: 1px solid #262e3d;
      border-radius: 12px;
      background: #1b2130;
      color: #e6e8ee;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.06s ease;
    }

    .key:hover  { background: #222a3b; border-color: #333d52; }
    .key:active { transform: scale(0.97); }
    .key:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }

    .key-fn { font-size: 14px; color: #9aa4b8; } /* 科学计算按键字体小一点 */
    .key-op { font-size: 20px; color: #60a5fa; }

    .key-eq {
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      border-color: #2563eb;
      color: #fff;
    }
    .key-eq:hover { background: linear-gradient(180deg, #4b8ef7, #2f6fe0); }

    /* ---------- 历史记录模块 ---------- */
    .history {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      background: #131720;
      border: 1px solid #232a38;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .history-header h2 { margin: 0; font-size: 16px; font-weight: 600; color: #e6e8ee; }

    .clear-btn {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .clear-btn:hover { background: #ef4444; color: #fff; }

    #history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
    }

    #history-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #0b0f17;
      border: 1px solid #1e2533;
      border-radius: 10px;
      font-size: 14px;
      color: #8b93a7;
    }

    .history-item-content {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #history-list li strong { color: #4ade80; font-weight: 500; }

    .delete-btn {
      background: transparent;
      border: none;
      color: #6b7280;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.2s;
    }
    .delete-btn:hover { color: #f87171; }
  </style>
</head>
<body>
  <main class="calculator">
    <header class="calc-header">
      <h1>科学计算器</h1>
      <p class="hint">前端发送 → 后端解析计算 → 返回结果 → 数据库存储</p>
    </header>

    <section class="display">
      <div class="expression" id="expression">0</div>
      <div class="result" id="result"></div>
    </section>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <!-- 科学计算按键区 -->
    <section class="keys-scientific">
      <button class="key key-fn" data-key="sin(">sin</button>
      <button class="key key-fn" data-key="cos(">cos</button>
      <button class="key key-fn" data-key="tan(">tan</button>
      <button class="key key-fn" data-key="log(">log</button>
      <button class="key key-fn" data-key="ln(">ln</button>
      <button class="key key-fn" data-key="sqrt(">√</button>
      <button class="key key-fn" data-key="^">^</button>
      <button class="key key-fn" data-key="π">π</button>
      <button class="key key-fn" data-key="e">e</button>
      <button class="key key-fn" data-key="!">!</button>
    </section>

    <!-- 基础按键区 -->
    <section class="keys" id="keys">
      <button class="key key-fn" data-key="C">C</button>
      <button class="key key-fn" data-key="⌫">⌫</button>
      <button class="key key-fn" data-key="(">(</button>
      <button class="key key-fn" data-key=")">)</button>

      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key key-op" data-key="÷">÷</button>

      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key key-op" data-key="×">×</button>

      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key key-op" data-key="-">−</button>

      <button class="key" data-key="0">0</button>
      <button class="key" data-key=".">.</button>
      <button class="key key-op" data-key="+">+</button>
      <button class="key key-eq" data-key="=">=</button>
    </section>
  </main>

  <!-- 历史记录模块 -->
  <section class="history">
    <div class="history-header">
      <h2>计算历史</h2>
      <button id="clear-history" class="clear-btn">清空全部</button>
    </div>
    <ul id="history-list">
      <!-- 历史记录将动态插入这里 -->
    </ul>
  </section>

  <script>
  (function () {
    'use strict';

    /* =========================================================
     * 配置：后端接口地址
     * ========================================================= */
    const API_BASE = ''; // 同源部署留空
    const ENDPOINT = API_BASE + '/api/calculate';

    // 基础运算符与科学计算符号映射
    const OPERATORS = ['+', '-', '×', '÷', '^'];
    const SCI_FUNCTIONS = ['sin(', 'cos(', 'tan(', 'log(', 'ln(', 'sqrt('];

    /* =========================================================
     * 状态管理
     * ========================================================= */
    const state = {
      expression: '',
      result: null,
      error: null,
      status: '',
      loading: false,
    };

    const $expression = document.getElementById('expression');
    const $result     = document.getElementById('result');
    const $status     = document.getElementById('status');
    const $keys       = document.getElementById('keys');
    const $sciKeys    = document.querySelector('.keys-scientific');
    const $historyList = document.getElementById('history-list');

    /* =========================================================
     * 渲染 UI
     * ========================================================= */
    function render() {
      $expression.textContent = state.expression || '0';

      if (state.loading) {
        $result.textContent = '计算中…';
        $result.className = 'result is-loading';
      } else if (state.error) {
        $result.textContent = state.error;
        $result.className = 'result is-error';
      } else if (state.result !== null) {
        $result.textContent = '= ' + state.result;
        $result.className = 'result is-ok';
      } else {
        $result.textContent = '';
        $result.className = 'result';
      }

      $status.textContent = state.status;
    }

    /* =========================================================
     * 输入分发
     * ========================================================= */
    function press(key) {
      if (state.loading) return;

      switch (key) {
        case 'C':
          state.expression = '';
          state.result = null;
          state.error = null;
          state.status = '';
          break;

        case '⌫':
          state.expression = state.expression.slice(0, -1);
          state.result = null;
          state.error = null;
          state.status = '';
          break;

        case '=':
          submit();
          return;

        default:
          appendToken(key);
          return;
      }
      render();
    }

    /* =========================================================
     * 追加字符，处理输入规则（包括科学计算和括号）
     * ========================================================= */
    function appendToken(token) {
      // 如果上一步已有结果，输入运算符则接着算，输入数字/函数则重新开始
      if (state.result !== null) {
        if (OPERATORS.includes(token) || SCI_FUNCTIONS.includes(token)) {
          state.expression = String(state.result);
        } else {
          state.expression = '';
        }
        state.result = null;
      }

      state.error = null;
      state.status = '';

      let expr = state.expression;
      const last = expr.slice(-1);

      // 处理小数点：同一数字段内只能有一个
      if (token === '.') {
        const segment = expr.split(/[+\-×÷()^]/).pop();
        if (segment.includes('.')) return;
        if (segment === '') token = '0.';
      }

      // 处理运算符：防止连续运算符，开头不允许非负号
      if (OPERATORS.includes(token)) {
        if (expr === '') {
          if (token !== '-') return; // 开头只允许负号
        } else if (OPERATORS.includes(last)) {
          // 连续运算符则替换上一个
          state.expression = expr.slice(0, -1) + token;
          render();
          return;
        } else if (last === '(') {
          if (token !== '-') return; // 括号内开头只允许负号
        }
      }

      // 处理右括号：必须有多余的左括号，且前面不能是运算符
      if (token === ')') {
        const open  = (expr.match(/\(/g) || []).length;
        const close = (expr.match(/\)/g) || []).length;
        if (open <= close) return;
        if (/[+\-×÷(^]$/.test(expr)) return;
      }

      // 处理左括号：前面是数字或右括号时自动补乘号
      if (token === '(' && /[0-9.)]$/.test(expr)) {
        expr += '×';
      }
      
      // 处理 π 和 e：前面是数字或右括号时自动补乘号
      if ((token === 'π' || token === 'e') && /[0-9.)]$/.test(expr)) {
        expr += '×';
      }

      state.expression = expr + token;
      render();
    }

    /* =========================================================
     * 前端拦截：防止明显不合法的表达式请求后端
     * ========================================================= */
    function isObviouslyIncomplete(expr) {
      const open  = (expr.match(/\(/g) || []).length;
      const close = (expr.match(/\)/g) || []).length;
      if (open !== close) return true;
      if (/[+\-×÷^]$/.test(expr)) return true;
      return false;
    }

    // 将前端的展示符号转换为后端可解析的符号
    function toBackendExpression(expr) {
      return expr.replace(/×/g, '*').replace(/÷/g, '/');
    }

    /* =========================================================
     * 提交给后端计算
     * ========================================================= */
    async function submit() {
      const expr = state.expression.trim();
      if (!expr || state.loading) return;

      if (isObviouslyIncomplete(expr)) {
        state.error = '表达式不完整，请检查括号或末尾运算符';
        state.status = '';
        render();
        return;
      }

      state.loading = true;
      state.error = null;
      state.status = '';
      render();

      try {
        const response = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            expression: toBackendExpression(expr),
          }),
        });

        const data = await response.json().catch(() => null);

        if (!response.ok) {
          throw new Error((data && (data.error || data.message)) || ('服务器返回 ' + response.status));
        }

        if (!data || data.success === false) {
          throw new Error((data && data.error) || '计算失败');
        }

        state.result = data.result;
        state.status = data.recordId ? '已保存记录 #' + data.recordId : '计算完成';
        
        // 计算成功后，刷新历史记录列表
        loadHistory();

      } catch (err) {
        state.error = err instanceof TypeError
          ? '无法连接服务器，请检查网络或接口地址'
          : (err.message || '未知错误');
      } finally {
        state.loading = false;
        render();
      }
    }

    /* =========================================================
     * 加载历史记录（GET）
     * ========================================================= */
    async function loadHistory() {
      if (!$historyList) return;
      try {
        const response = await fetch(ENDPOINT, { method: 'GET' });
        const data = await response.json();
        
        if (data.success && Array.isArray(data.data)) {
          // 防止 XSS 攻击：对表达式进行转义
          const escapeHTML = (str) => str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
          );

          if (data.data.length === 0) {
            $historyList.innerHTML = '<li style="justify-content: center; color: #6b7280;">暂无历史记录</li>';
            return;
          }

          $historyList.innerHTML = data.data
            .map(item => `
              <li>
                <div class="history-item-content">
                  <span>${escapeHTML(item.expression)}</span> 
                  <strong>= ${escapeHTML(String(item.result))}</strong>
                </div>
                <button class="delete-btn" data-id="${item.id}" title="删除此记录">×</button>
              </li>
            `)
            .join('');
        }
      } catch (err) {
        console.error('加载历史记录失败:', err);
      }
    }

    /* =========================================================
     * 删除单条历史记录（DELETE）
     * ========================================================= */
    async function deleteHistoryItem(id) {
      if (!id) return;
      try {
        const response = await fetch(`${ENDPOINT}?id=${id}`, { method: 'DELETE' });
        const data = await response.json();
        
        if (data.success) {
          loadHistory(); // 删除成功，重新加载列表
        } else {
          alert('删除失败: ' + (data.error || '未知错误'));
        }
      } catch (err) {
        alert('无法连接服务器，删除失败');
      }
    }

    /* =========================================================
     * 清空全部历史记录（DELETE）
     * ========================================================= */
    async function clearAllHistory() {
      if (!confirm('确定要清空全部计算历史吗？此操作不可恢复。')) return;
      try {
        const response = await fetch(`${ENDPOINT}?all=true`, { method: 'DELETE' });
        const data = await response.json();
        if (data.success) {
          loadHistory();
        } else {
          alert('清空失败: ' + (data.error || '未知错误'));
        }
      } catch (err) {
        alert('无法连接服务器，清空失败');
      }
    }

    /* =========================================================
     * 事件绑定
     * ========================================================= */
    // 标准键盘和科学键盘使用事件委托
    $keys.addEventListener('click', function (event) {
      const button = event.target.closest('button[data-key]');
      if (!button) return;
      press(button.dataset.key);
    });

    $sciKeys.addEventListener('click', function (event) {
      const button = event.target.closest('button[data-key]');
      if (!button) return;
      press(button.dataset.key);
    });

    // 历史记录列表的点击事件（删除单条记录）
    $historyList.addEventListener('click', function (event) {
      const deleteBtn = event.target.closest('.delete-btn');
      if (deleteBtn) {
        const id = deleteBtn.dataset.id;
        deleteHistoryItem(id);
      }
    });

    // 清空历史记录按钮
    document.getElementById('clear-history').addEventListener('click', clearAllHistory);

    // 键盘物理按键支持
    document.addEventListener('keydown', function (event) {
      const map = {
        '*': '×', '/': '÷', 'x': '×', 'X': '×',
        'Enter': '=', '=': '=',
        'Backspace': '⌫', 'Escape': 'C', 'Delete': 'C',
      };

      let key = event.key;

      if (/^[0-9]$/.test(key) || ['+', '-', '(', ')', '.', '^'].includes(key)) {
        // 原样使用
      } else if (key in map) {
        key = map[key];
      } else {
        return;
      }

      event.preventDefault();
      press(key);
    });

    /* =========================================================
     * 页面首次加载
     * ========================================================= */
    render();
    loadHistory(); // 自动获取一次历史记录

  })();
  </script>
</body>
</html>
